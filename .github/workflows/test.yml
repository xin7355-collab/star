name: test

on:
  push:
  pull_request:

# 只需要讀程式碼（上傳測試報告用的是工作流自己的權杖，不需要寫入權限）
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts：不執行套件的安裝腳本（供應鏈防護）
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: 打包檔與原始碼一致（vendor、Worker、modulepreload 清單）
        run: |
          npm run build
          node scripts/gen-preload.mjs
          git diff --exit-code -- vendor worker/dist index.html

  e2e:
    runs-on: ubuntu-latest
    # 安裝瀏覽器偶爾很慢（2026-11-25 連兩次各 12～13 分鐘，平常 30 秒），加上測試約 6 分鐘；留足時間，免得被切成紅燈
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # WebKit 是 Safari 的引擎：雲端工作階段沒有，CI 補跑一次，更接近 iPhone 實機
      # 每次最多 15 分鐘，卡住或失敗重試一次（timeout 會連同底下的 apt-get 一起結束，重試不會卡在套件鎖）
      - name: 安裝 Chromium、WebKit（卡住會重試）
        run: |
          for attempt in 1 2; do
            timeout --kill-after=30 900 npx playwright install --with-deps chromium webkit && exit 0
            echo "第 ${attempt} 次安裝失敗或超過 15 分鐘，重試"
          done
          exit 1
      - run: npm run test:e2e
        env:
          CI: '1'
          PW_WEBKIT: '1'
      # 真的瀏覽器量對比、觸控大小、鍵盤焦點、水平捲動（320／390／1440 與長內容），任何一張不是 CLEAN 就紅燈
      - name: design-qa 版面稽核
        if: always()
        run: npm run qa:design
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/design-qa
          retention-days: 7
          if-no-files-found: ignore
